# ============================================================
# Anycubic Mega S — BTT SKR Mini E3 V3.0 — CR Touch — Klipper
# Pi Zero 2 W | TFT35-E3 V3.0 Touch Mode via tftbridge
#
# BEFORE FIRST USE:
#   1. Replace the serial path below with your actual SKR serial ID
#      Run on Pi:  ls /dev/serial/by-id/
#   2. Run install.sh on the Pi to install tftbridge
#   3. Follow calibration steps in README.md
# ============================================================

[mcu]
# Run: ls /dev/serial/by-id/   — paste the result below
serial: /dev/serial/by-id/usb-Klipper_stm32g0b1xx_XXXXXXXXXXXX-if00
restart_method: command

# ============================================================
# PRINTER KINEMATICS — Anycubic Mega S
# ============================================================
[printer]
kinematics: cartesian
max_velocity: 200
max_accel: 2000
max_z_velocity: 10
max_z_accel: 100
square_corner_velocity: 5.0

# ============================================================
# STEPPER X
# If X moves the wrong direction, flip ! on dir_pin
# ============================================================
[stepper_x]
step_pin: PB13
dir_pin: !PB12
enable_pin: !PB14
microsteps: 16
rotation_distance: 40
endstop_pin: ^PC0
position_endstop: 0
position_min: 0
position_max: 210
homing_speed: 50

[tmc2209 stepper_x]
uart_pin: PC11
tx_pin: PC10
uart_address: 0
run_current: 0.800
stealthchop_threshold: 999999

# ============================================================
# STEPPER Y
# If Y moves the wrong direction, flip ! on dir_pin
# ============================================================
[stepper_y]
step_pin: PB10
dir_pin: !PB2
enable_pin: !PB11
microsteps: 16
rotation_distance: 40
endstop_pin: ^PC1
position_endstop: 0
position_min: 0
position_max: 210
homing_speed: 50

[tmc2209 stepper_y]
uart_pin: PC11
tx_pin: PC10
uart_address: 2
run_current: 0.800
stealthchop_threshold: 999999

# ============================================================
# STEPPER Z — T8 leadscrew 8mm pitch
# If Z moves the wrong direction, flip ! on dir_pin
# ============================================================
[stepper_z]
step_pin: PB0
dir_pin: PC5
enable_pin: !PB1
microsteps: 16
rotation_distance: 8
endstop_pin: probe:z_virtual_endstop
position_min: -5
position_max: 205

[tmc2209 stepper_z]
uart_pin: PC11
tx_pin: PC10
uart_address: 1
run_current: 0.800
stealthchop_threshold: 999999

# ============================================================
# EXTRUDER
# rotation_distance derived from Marlin E-steps 384:
#   (200 steps/rev × 16 microsteps) / 384 steps/mm = 8.333
# Calibrate with e-step procedure after setup
# ============================================================
[extruder]
step_pin: PB3
dir_pin: !PB4
enable_pin: !PD1
microsteps: 16
rotation_distance: 8.333
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PC8
sensor_type: Generic 3950
sensor_pin: PA0
min_temp: 0
max_temp: 250
min_extrude_temp: 170
pressure_advance: 0.0

[tmc2209 extruder]
uart_pin: PC11
tx_pin: PC10
uart_address: 3
run_current: 0.650
stealthchop_threshold: 999999

# ============================================================
# HEATED BED
# ============================================================
[heater_bed]
heater_pin: PC9
sensor_type: Generic 3950
sensor_pin: PC4
min_temp: 0
max_temp: 110

# ============================================================
# FANS
# FAN0 PC6  = part cooling (speed controlled by slicer)
# FAN1 PB15 = hotend heatsink (auto on when hotend > 50°C)
# FAN2 PC7  = board cooling (auto on when any stepper active)
# ============================================================
[fan]
pin: PC6

[heater_fan hotend_fan]
pin: PB15
heater: extruder
heater_temp: 50.0

[controller_fan board_fan]
pin: PC7

# ============================================================
# CR TOUCH
# ^ on sensor_pin enables pull-up — REQUIRED, do not remove
# x_offset / y_offset from Marlin NOZZLE_TO_PROBE_OFFSET
# z_offset: set via PROBE_CALIBRATE after installation
# ============================================================
[bltouch]
sensor_pin: ^PC14
control_pin: PA1
x_offset: -44.0
y_offset: -9.0
z_offset: 0.0
speed: 5
samples: 2
sample_retract_dist: 5.0
stow_on_each_sample: False
probe_with_touch_mode: True

# ============================================================
# SAFE Z HOME
# Nozzle moves to (127,109) so probe lands at bed centre (83,100)
# Calculated: nozzle = probe_centre - (x_offset, y_offset)
#             = (83-(-44), 100-(-9)) = (127, 109)
# ============================================================
[safe_z_home]
home_xy_position: 127, 109
speed: 80
z_hop: 10
z_hop_speed: 10

# ============================================================
# BED MESH
# Probe limits account for CR Touch offset from nozzle:
#   mesh_min probe X: nozzle must be ≥44 → probe ≥0  → use 10
#   mesh_max probe X: nozzle ≤210 → probe ≤166        → use 155
#   mesh_min probe Y: nozzle must be ≥9  → probe ≥0  → use 10
#   mesh_max probe Y: nozzle ≤210 → probe ≤201        → use 190
# ============================================================
[bed_mesh]
speed: 100
horizontal_move_z: 5
mesh_min: 10, 10
mesh_max: 155, 190
probe_count: 5, 5
algorithm: bicubic
fade_start: 1
fade_end: 10

# ============================================================
# REQUIRED FOR PAUSE / RESUME / CANCEL / TFT INTEGRATION
# ============================================================
[pause_resume]

[display_status]

[virtual_sdcard]
path: ~/printer_data/gcodes

# ============================================================
# TFTBRIDGE — TFT35-E3 Touch Mode via Raspberry Pi GPIO UART
#
# TFT35 wiring (to Pi 40-pin header):
#   TFT GND → Pi Pin 6  (GND)
#   TFT VCC → Pi Pin 4  (5V)
#   TFT TX  → Pi Pin 10 (GPIO15 / RX)
#   TFT RX  → Pi Pin 8  (GPIO14 / TX)
#   TFT RST → not connected
#
# tft_baud must match TFT config.ini serial_port:P1 value
# P1:6 = 115200 baud (confirmed in config.ini)
#
# IMPORTANT: After any printer.cfg change, restart Klipper via:
#   sudo systemctl restart klipper
# The Mainsail web UI restart does NOT reload tftbridge.
# ============================================================
[tftbridge]
tft_device: /dev/ttyAMA0
tft_baud: 115200
tft_timeout: 0
klipper_device: /home/pi/printer_data/comms/klippy.serial
klipper_baud: 115200
klipper_timeout: 0

# ============================================================
# PRINT MACROS
# Set slicer start gcode to: START_PRINT BED_TEMP=[bed_temperature] EXTRUDER_TEMP=[nozzle_temperature]
# Set slicer end gcode to:   END_PRINT
# ============================================================
[gcode_macro START_PRINT]
gcode:
    {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(200)|float %}
    M140 S{BED_TEMP}
    M104 S{EXTRUDER_TEMP}
    G28
    BED_MESH_CALIBRATE
    G1 Z5 F3000
    M190 S{BED_TEMP}
    M109 S{EXTRUDER_TEMP}
    G92 E0
    G1 X5 Y20 Z0.3 F5000
    G1 X5 Y150 E15 F1000
    G92 E0

[gcode_macro END_PRINT]
gcode:
    G91
    G1 E-4 F3000
    G1 Z10 F3000
    G90
    G1 X5 Y200 F5000
    M106 S0
    M104 S0
    M140 S0
    M84

[gcode_macro PAUSE]
rename_existing: BASE_PAUSE
gcode:
    SAVE_GCODE_STATE NAME=PAUSE_state
    BASE_PAUSE
    G91
    G1 E-4 F3000
    G1 Z10 F3000
    G90
    G1 X5 Y5 F5000

[gcode_macro RESUME]
rename_existing: BASE_RESUME
gcode:
    G91
    G1 E4 F3000
    G90
    RESTORE_GCODE_STATE NAME=PAUSE_state MOVE=1
    BASE_RESUME

[gcode_macro CANCEL_PRINT]
rename_existing: BASE_CANCEL_PRINT
gcode:
    END_PRINT
    BASE_CANCEL_PRINT

